name: SonarQube
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Pushes to main analyse the main branch. Pull requests are analysed as
# SonarQube pull requests (Community Branch Plugin): only the changed code is
# rated and SonarQube reports the quality gate as a check plus a summary
# comment through its GitHub App. PRs from forks are skipped because they
# cannot read SONAR_TOKEN.
permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft)
    runs-on: arc-beasty-arr
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # analyse the PR head, not the synthetic merge commit
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install dirmngr for scanner signature verification
        # The minimal ARC runner image ships gpg without dirmngr.
        run: |
          if ! command -v dirmngr >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends dirmngr
          fi
      - name: Pull request parameters
        id: pr
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "args=-Dsonar.pullrequest.key=$PR_NUMBER -Dsonar.pullrequest.branch=$PR_HEAD_REF -Dsonar.pullrequest.base=$PR_BASE_REF -Dsonar.scm.revision=$PR_HEAD_SHA"
          } >> "$GITHUB_OUTPUT"
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          # The runner image has no UTF-8 locale; without it the scanner
          # fails on non-ASCII file names.
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          SONAR_SCANNER_JAVA_OPTS: -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
        with:
          args: >
            -Dsonar.projectKey=beastyrabbit_beasty-arr_3283b871-80c4-49dd-a4cf-4c451b4822be
            ${{ steps.pr.outputs.args }}
