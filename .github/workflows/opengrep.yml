name: OpenGrep
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    - cron: '37 0 * * *'
permissions:
  contents: read
  actions: read
  pull-requests: write
  checks: write
concurrency:
  group: opengrep-${{ github.event.pull_request.number || 'full' }}
  cancel-in-progress: true
jobs:
  opengrep:
    uses: beastyrabbit/schaffa/.github/workflows/opengrep-shared.yml@cd0e2b67cb0c599fbc148a4c73d2b321a8b35dbc
    with:
      runner: arc-opengrep-beasty-arr
      profile: all
      tooling-ref: cd0e2b67cb0c599fbc148a4c73d2b321a8b35dbc
