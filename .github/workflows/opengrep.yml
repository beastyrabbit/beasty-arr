name: OpenGrep
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    - cron: '37 0 * * *'
permissions:
  contents: read
  actions: read
  pull-requests: write
  checks: write
concurrency:
  group: opengrep-${{ github.event.pull_request.number || 'full' }}
  cancel-in-progress: true
jobs:
  opengrep:
    uses: beastyrabbit/schaffa/.github/workflows/opengrep-shared.yml@1d0e0110deb94136a4cf4b6d7e039193e895f9e8
    with:
      runner: arc-opengrep-beasty-arr
      profile: all
      tooling-ref: 1d0e0110deb94136a4cf4b6d7e039193e895f9e8
